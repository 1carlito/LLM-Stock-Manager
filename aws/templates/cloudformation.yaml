          ${!Include ../../fundamental_reports/WFC_fundamental_analysis_20250911_204200.json}
          EOL
          cat > fundamental_reports/XOM_fundamental_analysis_20250911_204210.json << 'EOL'
          ${!Include ../../fundamental_reports/XOM_fundamental_analysis_20250911_204210.json}
