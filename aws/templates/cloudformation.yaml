AWSTemplateFormatVersion: '2010-09-09'
Description: 'Stock Agent Backtest Infrastructure'

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment name
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API Key for the stock agent

Resources:
  # VPC and Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-routes

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # S3 Bucket for results
  BacktestResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub stock-agent-backtest-${EnvironmentName}
      VersioningConfiguration:
        Status: Enabled

  # SNS Topic for notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub stock-agent-alerts-${EnvironmentName}

  # EC2 Instance Role
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSNSFullAccess

  # EC2 Instance Profile
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # Security Group
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for stock agent EC2 instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: ami-0eb260c4d5475b901  # Ubuntu 22.04 LTS AMI for eu-west-2
      KeyName: stock-agent-key-new     # Added key pair name here
      SubnetId: !Ref PublicSubnet
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update
          apt-get install -y docker.io git
          systemctl start docker
          systemctl enable docker
          usermod -a -G docker ubuntu

          # Create app directory
          mkdir -p /app/{valuation_reports,fundamental_reports,sentiment_data,news_data}
          cd /app

          # Copy application files
          cat > backtest_orchestrator.py << 'EOL'
          ${!Include ../../backtest_orchestrator.py}
          EOL

          cat > requirements.txt << 'EOL'
          ${!Include ../../requirements.txt}
          EOL

          cat > Dockerfile << 'EOL'
          ${!Include ../../aws/Dockerfile}
          EOL

          # Copy valuation reports
          cat > valuation_reports/GOOGL_technical_analysis_20250911_204015.json << 'EOL'
          ${!Include ../../valuation_reports/GOOGL_technical_analysis_20250911_204015.json}
          EOL
          cat > valuation_reports/NVDA_technical_analysis_20250911_204028.json << 'EOL'
          ${!Include ../../valuation_reports/NVDA_technical_analysis_20250911_204028.json}
          EOL
          cat > valuation_reports/PLTR_technical_analysis_20250911_204043.json << 'EOL'
          ${!Include ../../valuation_reports/PLTR_technical_analysis_20250911_204043.json}
          EOL
          cat > valuation_reports/ABBV_technical_analysis_20250911_204101.json << 'EOL'
          ${!Include ../../valuation_reports/ABBV_technical_analysis_20250911_204101.json}
          EOL
          cat > valuation_reports/TMO_technical_analysis_20250911_204111.json << 'EOL'
          ${!Include ../../valuation_reports/TMO_technical_analysis_20250911_204111.json}
          EOL
