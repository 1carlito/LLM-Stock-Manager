          ${!Include ../../news_data/BAC_manual_news_20250911_194259.json}
          EOL
          cat > news_data/WFC_manual_news_20250911_194259.json << 'EOL'
          ${!Include ../../news_data/WFC_manual_news_20250911_194259.json}
          EOL
          cat > news_data/XOM_manual_news_20250911_194259.json << 'EOL'
          ${!Include ../../news_data/XOM_manual_news_20250911_194259.json}
          EOL
          cat > news_data/CVX_manual_news_20250911_194259.json << 'EOL'
          ${!Include ../../news_data/CVX_manual_news_20250911_194259.json}
          EOL
          cat > news_data/COP_manual_news_20250911_194259.json << 'EOL'
