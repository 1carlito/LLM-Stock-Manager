          EOL
          cat > valuation_reports/COP_technical_analysis_20250911_204227.json << 'EOL'
          ${!Include ../../valuation_reports/COP_technical_analysis_20250911_204227.json}
          EOL

          # Copy fundamental reports
          cat > fundamental_reports/GOOGL_fundamental_analysis_20250911_204020.json << 'EOL'
          ${!Include ../../fundamental_reports/GOOGL_fundamental_analysis_20250911_204020.json}
          EOL
          cat > fundamental_reports/NVDA_fundamental_analysis_20250911_204033.json << 'EOL'
          ${!Include ../../fundamental_reports/NVDA_fundamental_analysis_20250911_204033.json}
          EOL
          cat > fundamental_reports/PLTR_fundamental_analysis_20250911_204054.json << 'EOL'
          ${!Include ../../fundamental_reports/PLTR_fundamental_analysis_20250911_204054.json}
          EOL
          cat > fundamental_reports/ABBV_fundamental_analysis_20250911_204104.json << 'EOL'
          ${!Include ../../fundamental_reports/ABBV_fundamental_analysis_20250911_204104.json}
          EOL
          cat > fundamental_reports/TMO_fundamental_analysis_20250911_204116.json << 'EOL'
          ${!Include ../../fundamental_reports/TMO_fundamental_analysis_20250911_204116.json}
          EOL
          cat > fundamental_reports/UNH_fundamental_analysis_20250911_204128.json << 'EOL'
          ${!Include ../../fundamental_reports/UNH_fundamental_analysis_20250911_204128.json}
          EOL
          cat > fundamental_reports/JPM_fundamental_analysis_20250911_204137.json << 'EOL'
          ${!Include ../../fundamental_reports/JPM_fundamental_analysis_20250911_204137.json}
          EOL
          cat > fundamental_reports/BAC_fundamental_analysis_20250911_204150.json << 'EOL'
