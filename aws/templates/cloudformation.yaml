          EOL
          cat > sentiment_data/PLTR_sentiment_analysis_20250912_124747.json << 'EOL'
          ${!Include ../../sentiment_data/PLTR_sentiment_analysis_20250912_124747.json}
          EOL
          cat > sentiment_data/ABBV_sentiment_analysis_20250912_124820.json << 'EOL'
          ${!Include ../../sentiment_data/ABBV_sentiment_analysis_20250912_124820.json}
          EOL
          cat > sentiment_data/TMO_sentiment_analysis_20250912_124840.json << 'EOL'
